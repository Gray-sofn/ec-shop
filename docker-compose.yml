services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "0"
      HOST: "0.0.0.0"
    stdin_open: true
    tty: true

  api:
    build:
      context: ./APIserver
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./APIserver:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"

volumes:
  frontend_node_modules:
  api_node_modules:
